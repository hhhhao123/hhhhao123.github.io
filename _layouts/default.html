<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description }}">
    <meta name="theme-color" content="#f1faee">
    <meta property="og:title" content="{% if page.title and page.title != 'Home' %}{{ page.title }} | {% endif %}{{ site.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <title>{% if page.title and page.title != 'Home' %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231a2332'/%3E%3Ctext x='32' y='39' text-anchor='middle' font-family='Arial,sans-serif' font-size='20' font-weight='700' fill='%23f1faee'%3EWH%3C/text%3E%3C/svg%3E">
    <script>document.documentElement.classList.add("has-js");</script>
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  </head>
  <body class="{{ page.body_class }}">
    <a class="skip-link" href="#main">{% if page.lang == 'en' %}Skip to content{% else %}跳到主要内容{% endif %}</a>
    <header class="site-header">
      <span class="scroll-progress" aria-hidden="true"></span>
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="返回 Wenhao He 首页">
        Wenhao He
      </a>
      <a class="header-link" href="https://github.com/{{ site.author.github }}" rel="me">GitHub</a>
    </header>
    <main id="main">
      {{ content }}
    </main>
    <footer class="site-footer">
      <p class="footer-name">Wenhao He</p>
      <div class="footer-links" aria-label="联系方式">
        <a href="https://github.com/{{ site.author.github }}" rel="me">GitHub</a>
        <a href="mailto:{{ site.author.email }}">{{ site.author.email }}</a>
      </div>
      <p class="footer-meta">&copy; {{ 'now' | date: '%Y' }} Wenhao He</p>
    </footer>
    <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
  </body>
</html>
